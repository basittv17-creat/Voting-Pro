name: Android UI Smoke

on:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'lib/widgets/premium_text_editor_panel.dart'
      - 'test/text_toolbar_test.dart'
      - 'test/premium_text_editor_panel_test.dart'
      - 'integration_test/text_toolbar_android_test.dart'
      - 'test/android_apk_workflow_test.dart'
      - '.github/workflows/android-ui-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vs-styles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Prepare app
        run: |
          flutter create . --platforms=android --project-name votingpro --org com.awasigogera --no-pub
          bash scripts/fetch_bg_remover_model.sh
          flutter pub get

      - name: Prepare Android emulator
        run: |
          image='system-images;android-29;google_apis;x86_64'
          manager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print | sort -V | tail -1)"
          if [ -z "$manager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -o "$RUNNER_TEMP/android-command-line-tools.zip"
            unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$RUNNER_TEMP/android-command-line-tools"
            manager="$RUNNER_TEMP/android-command-line-tools/cmdline-tools/bin/sdkmanager"
          fi
          "$manager" --sdk_root="$ANDROID_HOME" 'emulator' 'platform-tools' "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/voting-pro-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$(dirname "$manager")/avdmanager" create avd --force \
            --name voting_pro_ci --package "$image" --device pixel_2 \
            --path "$ANDROID_AVD_HOME/voting_pro_ci.avd"
          test -f "$ANDROID_AVD_HOME/voting_pro_ci.ini"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Verify VS Styles and the Text toolbar on Android
        run: |
          adb start-server
          emulator -list-avds | grep -Fx voting_pro_ci
          emulator -avd voting_pro_ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -port 5554 > "$RUNNER_TEMP/voting-pro-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$emulator_pid"
          timeout 90 adb -s emulator-5554 wait-for-device
          timeout 180 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb -s emulator-5554 shell wm size 786x1704
          adb -s emulator-5554 shell wm density 320
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          flutter drive --no-pub -d emulator-5554 --driver=test_driver/android_screenshot_driver.dart --target=integration_test/vs_styles_android_test.dart
          flutter drive --no-pub -d emulator-5554 --driver=test_driver/android_screenshot_driver.dart --target=integration_test/text_toolbar_android_test.dart

      - name: Report emulator diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/voting-pro-emulator.log" ]; then
            tail -100 "$RUNNER_TEMP/voting-pro-emulator.log"
          fi

      # flutter drive leaves an integration-test entrypoint in app-debug.apk.
      # NEVER publish that test-runner APK as the installable Voting Pro app.
      # Rebuild explicitly from the production entrypoint after device tests.
      - name: Rebuild a normal installable Voting Pro APK with its launcher icon
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          sed -i 's/android:label="[^"]*"/android:label="Voting Pro"/' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:label="Voting Pro"' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          flutter build apk --debug --target lib/main.dart
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Install normal APK and verify app stays open after splash
        run: |
          set -euo pipefail
          PACKAGE=com.awasigogera.votingpro
          APK=build/app/outputs/flutter-apk/app-debug.apk
          adb -s emulator-5554 install -r "$APK"
          adb -s emulator-5554 shell am force-stop "$PACKAGE"
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          # Splash transitions into the real Editor after 2.2 seconds.
          sleep 8
          pid="$(adb -s emulator-5554 shell pidof -s "$PACKAGE" | tr -d '\r')"
          test -n "$pid"
          if adb -s emulator-5554 logcat -d -s AndroidRuntime:E | grep -Fq 'FATAL EXCEPTION'; then
            echo '::error::Android app crashed during normal cold launch'
            adb -s emulator-5554 logcat -d -s AndroidRuntime:E
            exit 1
          fi
          mkdir -p build/android-screenshots
          adb -s emulator-5554 exec-out screencap -p > build/android-screenshots/text-09-normal-app-launch.png
          test -s build/android-screenshots/text-09-normal-app-launch.png
          echo "NORMAL_VOTING_PRO_LAUNCH_PASSED: PID=$pid"

      - name: Upload Android screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voting-pro-android-screenshots
          path: build/android-screenshots/*.png
          if-no-files-found: error

      - name: Upload installable normal-app debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voting-pro-normal-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
