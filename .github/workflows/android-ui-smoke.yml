name: Android UI Smoke

on:
  push:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'lib/widgets/premium_text_editor_panel.dart'
      - 'test/text_toolbar_test.dart'
      - 'test/premium_text_editor_panel_test.dart'
      - 'integration_test/text_toolbar_android_test.dart'
      - 'integration_test/photo_tools_android_test.dart'
      - 'integration_test/tagra_arena_android_test.dart'
      - 'lib/widgets/tagra_arena.dart'
      - 'assets/templates/tagra_*.png'
      - 'lib/widgets/bg_remover_page.dart'
      - 'lib/widgets/photo_scene.dart'
      - 'lib/widgets/photo_background_settings.dart'
      - 'lib/services/offline_bg_remover.dart'
      - 'lib/services/mask_history.dart'
      - 'lib/app_language.dart'
      - 'test/android_apk_workflow_test.dart'
      - '.github/workflows/android-ui-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  vs-styles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Prepare app
        run: |
          flutter create . --platforms=android --project-name votingpro --org com.awasigogera --no-pub
          bash scripts/fetch_bg_remover_model.sh
          flutter pub get

      - name: Prepare Android emulator
        run: |
          image='system-images;android-29;google_apis;x86_64'
          manager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print | sort -V | tail -1)"
          if [ -z "$manager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -o "$RUNNER_TEMP/android-command-line-tools.zip"
            unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$RUNNER_TEMP/android-command-line-tools"
            manager="$RUNNER_TEMP/android-command-line-tools/cmdline-tools/bin/sdkmanager"
          fi
          "$manager" --sdk_root="$ANDROID_HOME" 'emulator' 'platform-tools' "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/voting-pro-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$(dirname "$manager")/avdmanager" create avd --force \
            --name voting_pro_ci --package "$image" --device pixel_2 \
            --path "$ANDROID_AVD_HOME/voting_pro_ci.avd"
          test -f "$ANDROID_AVD_HOME/voting_pro_ci.ini"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Verify VS Styles and the Text toolbar on Android
        run: |
          set -euo pipefail
          adb start-server
          emulator -list-avds | grep -Fx voting_pro_ci
          emulator_pid=''
          stop_emulator() {
            if [ -n "$emulator_pid" ]; then
              adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
              emulator_pid=''
            fi
          }
          start_emulator() {
            emulator -avd voting_pro_ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -port 5554 >> "$RUNNER_TEMP/voting-pro-emulator.log" 2>&1 &
            emulator_pid=$!
            sleep 2
            kill -0 "$emulator_pid"
            timeout 90 adb -s emulator-5554 wait-for-device
            timeout 180 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
            adb -s emulator-5554 shell wm size 786x1704
            adb -s emulator-5554 shell wm density 320
            adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
            adb -s emulator-5554 shell wm dismiss-keyguard
          }
          trap stop_emulator EXIT
          # Isolate graphics state between suites. Retry once only when the
          # emulator process or ADB connection is lost, never a test assertion.
          run_ui_suite() {
            local log="$RUNNER_TEMP/voting-pro-drive.log"
            stop_emulator
            start_emulator
            local attempt result
            for attempt in 1 2; do
              result=0
              bash scripts/retry_dependency_download.sh flutter drive --no-pub -d emulator-5554 --driver=test_driver/android_screenshot_driver.dart "$@" 2>&1 | tee "$log" || result=$?
              if [ "$result" -eq 0 ]; then return 0; fi
              if [ "$attempt" -eq 2 ] || grep -Eq 'EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK|Some tests failed|Test failed' "$log"; then
                return "$result"
              fi
              if kill -0 "$emulator_pid" 2>/dev/null && [ "$(adb -s emulator-5554 get-state 2>/dev/null || true)" = device ]; then
                return "$result"
              fi
              echo "::warning::Android emulator disconnected; retrying the full suite on a fresh emulator"
              stop_emulator
              start_emulator
            done
          }
          run_ui_suite --target=integration_test/vs_styles_android_test.dart
          run_ui_suite --target=integration_test/text_toolbar_android_test.dart
          run_ui_suite --target=integration_test/photo_tools_android_test.dart
          stop_emulator
          start_emulator
          # Dismiss each native sharesheet and retain evidence of the real Android handoff.
          (
            for theme in thunder emerald; do
              timeout 420 bash -c 'until adb shell dumpsys activity activities | grep -E "mResumedActivity.*ChooserActivity" >/dev/null; do sleep 1; done'
              adb exec-out screencap -p > "build/android-screenshots/tagra-share-$theme.png"
              adb shell input keyevent KEYCODE_BACK
              sleep 2
            done
          ) &
          share_watcher=$!
          bash scripts/retry_dependency_download.sh flutter drive --no-pub -d emulator-5554 --driver=test_driver/android_screenshot_driver.dart --target=integration_test/tagra_arena_android_test.dart
          wait "$share_watcher"
          saved=$(adb shell content query --uri content://media/external/images/media --projection _display_name | grep -c 'voting_pro_')
          test "$saved" -ge 2

      - name: Report emulator diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/voting-pro-emulator.log" ]; then
            tail -100 "$RUNNER_TEMP/voting-pro-emulator.log"
          fi

      # flutter drive leaves an integration-test entrypoint in app-debug.apk.
      # NEVER publish that test-runner APK as the installable Voting Pro app.
      # Rebuild explicitly from the production entrypoint after device tests.
      - name: Rebuild a normal installable Voting Pro APK with its launcher icon
        run: |
          set -euo pipefail
          # Preserve Android integration screenshots: flutter clean deletes build/.
          mkdir -p "$RUNNER_TEMP/voting-pro-ui-screenshots"
          cp build/android-screenshots/*.png "$RUNNER_TEMP/voting-pro-ui-screenshots/"
          flutter clean
          flutter pub get
          sed -i 's/android:label="[^"]*"/android:label="Voting Pro"/' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:label="Voting Pro"' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          bash scripts/retry_dependency_download.sh flutter build apk --debug --target lib/main.dart
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p build/android-screenshots
          cp "$RUNNER_TEMP/voting-pro-ui-screenshots/"*.png build/android-screenshots/

      - name: Install normal APK and verify app stays open after splash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The integration-test step deliberately kills its emulator on exit.
          # Start a fresh emulator for the actual installable app cold-launch test.
          adb start-server
          emulator -list-avds | grep -Fx voting_pro_ci
          emulator -avd voting_pro_ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -port 5554 > "$RUNNER_TEMP/voting-pro-normal-launch-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 90 adb -s emulator-5554 wait-for-device
          timeout 180 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          PACKAGE=com.awasigogera.votingpro
          APK=build/app/outputs/flutter-apk/app-debug.apk
          adb -s emulator-5554 install -r "$APK"
          adb -s emulator-5554 shell am force-stop "$PACKAGE"
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
          # Splash transitions into the real Editor after 2.2 seconds.
          sleep 8
          pid="$(adb -s emulator-5554 shell pidof -s "$PACKAGE" | tr -d '\r')"
          test -n "$pid"
          if adb -s emulator-5554 logcat -d -s AndroidRuntime:E | grep -Fq 'FATAL EXCEPTION'; then
            echo '::error::Android app crashed during normal cold launch'
            adb -s emulator-5554 logcat -d -s AndroidRuntime:E
            exit 1
          fi
          mkdir -p build/android-screenshots
          adb -s emulator-5554 exec-out screencap -p > build/android-screenshots/text-09-normal-app-launch.png
          test -s build/android-screenshots/text-09-normal-app-launch.png
          echo "NORMAL_VOTING_PRO_LAUNCH_PASSED: PID=$pid"

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Compare with the signed artifact built from exactly this commit.
            release_id=''
            for attempt in $(seq 1 60); do
              release_id=$(gh run list --workflow flutter-build.yml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$release_id" ] && gh run download "$release_id" --name voting-pro-apk --dir "$RUNNER_TEMP/tagra-release"; then break; fi
              sleep 15
            done
            signed="$RUNNER_TEMP/tagra-release/app-release.apk"
            test -s "$signed"
            adb uninstall "$PACKAGE"
            adb install "$signed"
            adb shell am force-stop "$PACKAGE"
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof -s "$PACKAGE"
            if adb logcat -d -s AndroidRuntime:E | grep -F 'FATAL EXCEPTION' >/dev/null; then exit 1; fi
            adb exec-out screencap -p > build/android-screenshots/tagra-signed-cold-launch.png
          fi

      - name: Upload Android screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voting-pro-android-screenshots
          path: build/android-screenshots/*.png
          if-no-files-found: error

      - name: Upload installable normal-app debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voting-pro-normal-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
