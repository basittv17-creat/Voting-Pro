name: Build Flutter APK and Web

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platform folders
        run: flutter create . --platforms=android,web --project-name votingpostermaker --org com.awisogera

      - name: Set Android app display name
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Voting Pro"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure Android release signing
        env:
          STORE_FILE_BASE64: ${{ secrets.STORE_FILE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_FILE_BASE64"
          printf '%s' "$STORE_FILE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          python3 - <<'PYGRADLE'
          from pathlib import Path
          import sys

          p = Path("android/app/build.gradle.kts")
          if not p.is_file():
              print("ERROR: Generated Kotlin Gradle file not found.")
              sys.exit(1)

          s = p.read_text()
          anchor = '    buildTypes {'
          debug = 'signingConfig = signingConfigs.getByName("debug")'

          if anchor not in s or debug not in s:
              print("ERROR: Expected Gradle anchors not found; stopping.")
              sys.exit(1)

          signing = (
              '    signingConfigs {\n'
              '        create("release") {\n'
              '            storeFile = file("upload-keystore.jks")\n'
              '            storePassword = System.getenv("STORE_PASSWORD") ?: error("STORE_PASSWORD missing")\n'
              '            keyAlias = System.getenv("KEY_ALIAS") ?: error("KEY_ALIAS missing")\n'
              '            keyPassword = System.getenv("KEY_PASSWORD") ?: error("KEY_PASSWORD missing")\n'
              '        }\n'
              '    }\n\n'
          )

          if s.count(anchor) != 1:
              print("ERROR: Gradle buildTypes anchor is not unique.")
              sys.exit(1)
          if s.count(debug) != 1:
              print("ERROR: Debug signing anchor is not unique.")
              sys.exit(1)

          s = s.replace(anchor, signing + anchor, 1)
          s = s.replace(debug, 'signingConfig = signingConfigs.getByName("release")', 1)

          if debug in s or 'signingConfig = signingConfigs.getByName("release")' not in s:
              print("ERROR: Release signing verification failed.")
              sys.exit(1)

          p.write_text(s)
          print("ANDROID_SIGNING_CONFIGURED_AND_VERIFIED")
          PYGRADLE

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Get dependencies
        run: flutter pub get

      - name: Build Signed Android APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build Signed Android App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify Android signatures
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          jarsigner -verify "$AAB" >/dev/null
          echo "SIGNED_APK_AND_AAB_VERIFIED"

      - name: Build Web
        run: flutter build web --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: voting-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: voting-pro-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: voting-pro-web
          path: build/web/**
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
