name: Build Flutter APK and Web

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platform folders
        run: flutter create . --platforms=android,web --project-name voting_pro --org com.votingpro

      - name: Set Android app display name
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="voting_pro"/android:label="Voting Pro"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: voting-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: voting-pro-web
          path: build/web/**
          if-no-files-found: error
