name: voting_pro
description: Voting Pro — Flutter poster maker
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  gal: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stylish_frames/
    - assets/label_bars/a_side/
    - assets/label_bars/b_side/
    - assets/voting_stickers/
