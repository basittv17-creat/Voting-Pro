name: voting_pro
description: Voting Pro — Flutter poster maker
publish_to: "none"
version: 10.0.0+10
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  gal: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/stylish_frames/
    - assets/templates/
    - assets/label_bars/a_side/
    - assets/label_bars/b_side/
    - assets/voting_stickers/
    - assets/tagra_muqabla_stickers/
    - assets/b_letter_styles/
    - assets/a_letter_styles/

  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: RobotoLocal
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: OswaldLocal
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: PlayfairDisplayLocal
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: PacificoLocal
      fonts:
        - asset: assets/fonts/Pacifico.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#101020"
  adaptive_icon_foreground: "assets/app_icon.png"
